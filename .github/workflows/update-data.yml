name: 每日更新ETF除息資料

on:
  schedule:
    # 台灣時間每天凌晨 02:00 (UTC前一天 18:00)
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取資料(失敗會自動間隔重試，最多3次)
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "=== 第 ${attempt} 次嘗試 ==="
            python -u scripts/fetch_data.py
            if [ $? -eq 0 ]; then
              echo "抓取成功"
              exit 0
            fi
            echo "第 ${attempt} 次失敗，等待5分鐘後重試..."
            sleep 300
          done
          echo "三次都失敗，本次排程放棄，等下一次排程再試"
          exit 1

      - name: 提交更新後的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dividends.json data/etf_meta.json
          if git diff --cached --quiet; then
            echo "資料沒有變化，不需要commit"
            exit 0
          fi
          git commit -m "chore: 自動更新ETF除息資料 $(date -u +'%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            if git push; then
              echo "push成功"
              exit 0
            fi
            echo "push失敗(可能跟遠端有新的commit撞到)，第 ${attempt} 次，pull --rebase後重試..."
            git pull --rebase --autostash
            sleep 5
          done
          echo "push重試3次都失敗，放棄本次(資料已經抓好、下次排程會重新抓一次)"
          exit 1
