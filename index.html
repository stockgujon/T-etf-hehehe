<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>台股ETF除息追蹤</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>📅</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>台股ETF除息追蹤</h1>
        <div id="hero-stats" style="color: var(--text-muted); font-size: 13px; margin-top: 4px;"></div>
      </div>
      <div class="updated"><span id="updated-at" class="num"></span></div>
    </div>

    <div class="section-head">
      <div>
        <h2>近期除息行事曆</h2>
        <p>本月起自動往後銜接，月底前會提前接上下下個月・實線=已實際除息，虛線=公告預估尚未除息</p>
      </div>
      <div class="legend">
        <span><span class="dot" style="background: var(--freq-monthly)"></span>月配</span>
        <span><span class="dot" style="background: var(--freq-bimonthly)"></span>雙月配</span>
        <span><span class="dot" style="background: var(--freq-quarterly)"></span>季配</span>
        <span><span class="dot" style="background: var(--freq-semiannual)"></span>半年配</span>
        <span><span class="dot" style="background: var(--freq-annual)"></span>年配</span>
      </div>
    </div>
    <div id="calendars" class="calendars"></div>

    <div class="section-head">
      <div>
        <h2>全年除息月份總表</h2>
        <p>所有國內掛牌ETF（上市+上櫃），對應到通常除息的月份，僅供大致參考</p>
      </div>
    </div>
    <div class="filters">
      <input type="search" id="search-input" placeholder="搜尋代號或名稱..." />
      <span class="chip active" data-market-chip="全部">全部市場</span>
      <span class="chip" data-market-chip="TWSE">上市</span>
      <span class="chip" data-market-chip="TPEx">上櫃</span>
      <span class="chip active" data-cat-chip="全部">全部類型</span>
      <span class="chip" data-cat-chip="一般股票型">一般股票型</span>
      <span class="chip" data-cat-chip="槓桿反向">槓桿反向</span>
      <span class="chip" data-cat-chip="債券型">債券型</span>
      <span class="chip" data-cat-chip="商品期貨型">商品期貨型</span>
    </div>
    <div id="annual-table-wrap"></div>

    <footer>
      資料來源：TWSE / TPEx 公開清單、Yahoo Finance 除息事件，每日自動更新一次。配息頻率與全年月份為系統推估，僅供參考，實際請以各投信公告為準。
    </footer>
  </div>

  <div class="overlay" id="overlay">
    <div class="popover" id="popover-content"></div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
